services:
  - type: web
    runtime: node
    name: tiza-food-alonllosorio
    plan: 0.5c-512mb
    buildCommand: "npm install --ignore-scripts"
    startCommand: "npm start"
    healthCheckPath: /api/health
    disk:
      name: tiza-food-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TIZA_DATA_DIR
        value: /var/data
      - key: TIZA_PUBLIC_ORIGIN
        value: https://tiza-food-alonllosorio.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: TIZA_RECEIPT_FROM
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
