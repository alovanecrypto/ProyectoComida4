services:
  - type: web
    runtime: node
    name: tiza-food-alonllosorio
    # Plan gratuito para la demostración escolar. Los archivos locales se
    # reinician cuando Render vuelve a crear la instancia.
    plan: free
    buildCommand: "npm install --ignore-scripts"
    startCommand: "npm start"
    healthCheckPath: /api/health
    envVars:
      - key: TIZA_PUBLIC_ORIGIN
        value: https://tiza-food-alonllosorio.onrender.com
